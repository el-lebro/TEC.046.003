<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container"></div>
    <div class="card">
        <div class="card-header">drean island</div>
        <!-- tela central do jogo -->
        <div class="card-body" id="tela" style="background-image: url('assets/images.jpg');
        background-size: cover;">
            <div class="row">
                <div class="col tex-center ">
                    <ul class="list-group float-end text center" style="width: 225px;">
                        <li class="list-group-item"><strong id=nome-hero>jake</strong></li>
                        <li id="titulo-hero" class="list-group-item">o sonhador</li>
                        <li class="list-group-item">❤️
                            <progress id="hphero" value="100" max="100" style="accent-color: red"></progress>
                        </li>
                        <li class="list-group-item">🧪
                            <progress id="mp-hero" value="100" max="100"></progress>
                        </li>
                        <li class="list-group-item">
                            ☀️ <progress id="mega-hero" value="0" max="100" style="accent-color:orange"></progress></li>
                    </ul>
                </div>
                <!--  -->
                <div class="col">

                    <ul class="list-group float-start text center">
                        <li class="list-group-item"><strong id="nome-boss"></strong></li>
                        <li id="titulo-boss" class="list-group-item">o tenebre</li>
                        <li class="list-group-item">❤️
                            <progress id="hp-boss" value="150" max="150" style="accent-color: red;"></progress>
                        </li>
                        <li class="list-group-item">🧪
                            <progress id="mp-boss" value="150" max="150" style="accent-color: blue;"></progress>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="row">
                <div class="col text-end">
                    <img src="assets/a2849b_3d4f257714764c219858e879da7ba5eb~mv2.gif" width="400" height="400">
                    <div></div>
                    <div class="btn-group" id="controles"></div>
                </div>
                <div class="col text-start">
                    <img src="assets/cazok-everhood-2.gif" width="350" height="350">
                </div>
                <div class="card-footer tex-center">
                    <small class="text-muted">açoes do heroi</small>
                    <p></p>
                    <small class="text-muted">acoes do boss</small>
                </div>
            </div> <!-- fechamento do card -->
        </div> <!-- fechamento do container -->
</body>
<script src="javascript.js"></script>

</html>
